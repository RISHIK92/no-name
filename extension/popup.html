<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR Review Bot</title>
    <link rel="stylesheet" href="popup.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="header">
        <div class="header-brand">
          <div class="logo">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div>
            <h1 class="header-title">PR Review Bot</h1>
            <p class="header-sub">AI-Powered Code Review</p>
          </div>
        </div>
      </header>

      <!-- Status: Not a PR Page -->
      <div id="not-pr" class="state-card hidden">
        <div class="state-icon">🔗</div>
        <h2 class="state-title">Not a PR Page</h2>
        <p class="state-desc">
          Navigate to a GitHub Pull Request to start reviewing.
        </p>
        <div class="url-hint">
          github.com/<span class="dim">owner</span>/<span class="dim">repo</span
          >/pull/<span class="dim">123</span>
        </div>
      </div>

      <!-- Status: PR Detected -->
      <div id="pr-detected" class="hidden">
        <div class="pr-info-card">
          <div class="pr-url-row">
            <svg
              class="gh-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              />
            </svg>
            <span id="pr-url-text" class="pr-url-text">Loading...</span>
          </div>
          <div class="pr-meta" id="pr-meta"></div>
        </div>

        <!-- Options -->
        <div class="options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="post-comment" />
            <span class="checkmark"></span>
            Post as PR comment
          </label>
        </div>

        <!-- Action Button -->
        <button id="review-btn" class="review-btn">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <span>Analyze PR</span>
        </button>
      </div>

      <!-- Loading State -->
      <div id="loading" class="hidden">
        <div class="loading-card">
          <div class="spinner-wrapper">
            <div class="spinner"></div>
            <svg
              class="spinner-icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
              />
            </svg>
          </div>
          <div>
            <h3 class="loading-title">Analyzing PR</h3>
            <p class="loading-phase" id="loading-phase">Fetching PR data...</p>
          </div>
        </div>
        <div class="shimmer-lines">
          <div class="shimmer-line" style="width: 80%"></div>
          <div class="shimmer-line" style="width: 60%"></div>
          <div class="shimmer-line" style="width: 70%"></div>
        </div>
      </div>

      <!-- Error State -->
      <div id="error" class="hidden">
        <div class="error-card">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"
            />
          </svg>
          <div>
            <h3 class="error-title">Analysis Failed</h3>
            <p class="error-msg" id="error-msg"></p>
          </div>
        </div>
        <button id="retry-btn" class="retry-btn">Try Again</button>
      </div>

      <!-- Results -->
      <div id="results" class="hidden">
        <!-- Summary Stats -->
        <div class="summary-grid" id="summary-grid"></div>

        <!-- Phase Sections -->
        <div id="phases-container"></div>

        <!-- Actions -->
        <div class="actions-row">
          <button id="copy-btn" class="action-btn">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />
            </svg>
            Copy Markdown
          </button>
          <button id="open-full-btn" class="action-btn secondary">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"
              />
            </svg>
            Full Report
          </button>
        </div>

        <!-- Comment Status -->
        <div id="comment-status" class="hidden"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
